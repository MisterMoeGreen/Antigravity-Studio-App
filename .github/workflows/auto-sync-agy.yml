name: Auto-Sync Google Antigravity & Release APK

on:
  schedule:
    # Run twice a week: Mondays & Thursdays at 00:00 UTC
    - cron: '0 0 * * 1,4'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if upstream version has not changed'
        required: false
        default: false
        type: boolean
      custom_agy_version:
        description: 'Override upstream version string (optional)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  sync-and-build:
    name: Sync, Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install Host Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd python3 curl jq binutils-aarch64-linux-gnu
          # CRITICAL: Install patchelf 0.19.2 (fixes DT_STRTAB page-alignment corruption on large ELFs present in 0.18.0)
          curl -sSL "https://github.com/NixOS/patchelf/releases/download/0.19.2/patchelf-0.19.2-x86_64.tar.gz" | sudo tar -xz -C /usr/local
          patchelf --version

      - name: Check Upstream Google Antigravity Version
        id: check_upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_AGY_VER=$(grep '^AGY_VERSION=' version.properties | cut -d'=' -f2)
          CURRENT_CODE=$(grep '^VERSION_CODE=' version.properties | cut -d'=' -f2)
          CURRENT_NAME=$(grep '^VERSION_NAME=' version.properties | cut -d'=' -f2)
          echo "Current repo agy version: $CURRENT_AGY_VER (App: $CURRENT_NAME, Code: $CURRENT_CODE)"

          UPSTREAM_VER="${{ inputs.custom_agy_version }}"
          if [ -z "$UPSTREAM_VER" ]; then
            UPSTREAM_VER=$(curl -sSL -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/wallentx/antigravity-cli-termux/releases/latest" | jq -r '.tag_name // empty' | sed 's/^v//')
            [ -z "$UPSTREAM_VER" ] && UPSTREAM_VER="$CURRENT_AGY_VER"
          fi
          echo "Latest upstream agy version: $UPSTREAM_VER"

          SHOULD_BUILD=false
          if [ "${{ inputs.force_build }}" = "true" ] || [ "$UPSTREAM_VER" != "$CURRENT_AGY_VER" ]; then
            SHOULD_BUILD=true
          fi

          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT
          echo "upstream_ver=$UPSTREAM_VER" >> $GITHUB_OUTPUT
          echo "current_agy_ver=$CURRENT_AGY_VER" >> $GITHUB_OUTPUT
          echo "current_code=$CURRENT_CODE" >> $GITHUB_OUTPUT
          echo "current_name=$CURRENT_NAME" >> $GITHUB_OUTPUT

      - name: Process Binaries & Bump Version
        if: steps.check_upstream.outputs.should_build == 'true'
        id: version_bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OLD_CODE=${{ steps.check_upstream.outputs.current_code }}
          NEW_CODE=$((OLD_CODE + 1))
          
          OLD_NAME="${{ steps.check_upstream.outputs.current_name }}"
          BASE_NAME=$(echo "$OLD_NAME" | cut -d'.' -f1,2)
          PATCH_NUM=$(echo "$OLD_NAME" | cut -d'.' -f3)
          NEW_PATCH=$((PATCH_NUM + 1))
          NEW_NAME="${BASE_NAME}.${NEW_PATCH}"
          NEW_AGY_VER="${{ steps.check_upstream.outputs.upstream_ver }}"
          OLD_AGY_VER="${{ steps.check_upstream.outputs.current_agy_ver }}"

          echo "Bumping version: $OLD_NAME (code $OLD_CODE) -> $NEW_NAME (code $NEW_CODE)"
          echo "Bundling agy version: $NEW_AGY_VER (previous: $OLD_AGY_VER)"

          # Fetch baseline toolchain and assets from latest published release APK
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets
          if [ ! -f "app/src/main/jniLibs/arm64-v8a/libbash.so" ]; then
            echo "Fetching baseline runtime from latest published release APK..."
            # Try downloading via GitHub CLI first
            gh release download -R "${{ github.repository }}" -p "*.apk" --clobber 2>/dev/null || true
            APK_FILE=$(ls AntigravityStudio*.apk *.apk 2>/dev/null | head -n 1)

            # Fallback to GitHub Releases API if gh download didn't find an APK
            if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
              echo "Searching GitHub releases API for latest published APK..."
              APK_URL=$(curl -sSL -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${{ github.repository }}/releases" \
                | jq -r '.[].assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
              if [ -n "$APK_URL" ] && [ "$APK_URL" != "null" ]; then
                echo "Downloading APK from $APK_URL..."
                curl -sSL -f -o prev.apk "$APK_URL"
                APK_FILE="prev.apk"
              fi
            fi

            if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
              echo "Extracting baseline runtime from $APK_FILE..."
              unzip -q "$APK_FILE" "lib/arm64-v8a/*" "assets/*"
              cp -r lib/arm64-v8a/* app/src/main/jniLibs/arm64-v8a/
              [ -f "assets/usr-data.tar.zst" ] && cp assets/usr-data.tar.zst app/src/main/assets/
              # Restore repo rootfs.tar.zst so baseline APK does not overwrite tracked version
              git checkout HEAD -- app/src/main/assets/rootfs.tar.zst 2>/dev/null || true
              rm -rf "$APK_FILE" prev.apk lib assets
            else
              echo "Error: Could not locate baseline APK from any GitHub release!" >&2
              exit 1
            fi
          fi

          # Verify container bridge libraries in baseline; recover from v1.4.3 if missing
          if [ ! -f "app/src/main/jniLibs/arm64-v8a/libagy_sh.so" ] || [ ! -f "app/src/main/jniLibs/arm64-v8a/libproot.so" ]; then
            echo "Container bridge binaries missing from baseline APK! Recovering from v1.4.3..."
            curl -sSL -f -o v143.apk "https://github.com/${{ github.repository }}/releases/download/v1.4.3/AntigravityStudio-v1.4.3.apk" 2>/dev/null || true
            if [ -f "v143.apk" ]; then
              unzip -qo "v143.apk" "lib/arm64-v8a/libagy_sh.so" "lib/arm64-v8a/libproot.so" "lib/arm64-v8a/libproot_loader.so" 2>/dev/null || true
              cp -u lib/arm64-v8a/* app/src/main/jniLibs/arm64-v8a/ 2>/dev/null || true
              rm -rf v143.apk lib 2>/dev/null || true
            fi
          fi

          # If upstream agy version changed, force_build was requested, or baseline is missing/corrupted, download and patch new upstream agy.va39 into libagy.so
          NEW_SHA256=""
          IS_CORRUPT=false
          if [ -f "app/src/main/jniLibs/arm64-v8a/libagy.so" ]; then
            if aarch64-linux-gnu-readelf -d "app/src/main/jniLibs/arm64-v8a/libagy.so" 2>&1 | grep -qi "unable to parse DT_STRTAB"; then
              echo "Detected corrupted DT_STRTAB in baseline libagy.so!"
              IS_CORRUPT=true
            fi
          fi

          if [ "$NEW_AGY_VER" != "$OLD_AGY_VER" ] || [ "${{ inputs.force_build }}" = "true" ] || [ ! -f "app/src/main/jniLibs/arm64-v8a/libagy.so" ] || [ "$IS_CORRUPT" = "true" ]; then
            echo "Downloading upstream agy v${NEW_AGY_VER}..."
            TAR_URL="https://github.com/wallentx/antigravity-cli-termux/releases/download/v${NEW_AGY_VER}/antigravity-termux-standalone.tar.gz"
            curl -sSL -f -o agy.tar.gz "$TAR_URL"
            NEW_SHA256=$(sha256sum agy.tar.gz | cut -d' ' -f1)
            tar -xzf agy.tar.gz agy.va39
            mv agy.va39 app/src/main/jniLibs/arm64-v8a/libagy.so
            chmod 755 app/src/main/jniLibs/arm64-v8a/libagy.so
            patchelf --page-size 16384 \
              --set-interpreter "/data/data/ai.agy.app/files/usr/glibc/lib/ld-linux-aarch64.so.1" \
              --force-rpath --set-rpath "/data/data/ai.agy.app/files/usr/glibc/lib" \
              app/src/main/jniLibs/arm64-v8a/libagy.so
            python3 -c "path='app/src/main/jniLibs/arm64-v8a/libagy.so'; d=open(path,'rb').read(); open(path,'wb').write(d.replace(b'/data/data/com.termux',b'/data/data/ai.agy.app'))"
            rm -f agy.tar.gz

            # Verify that DT_STRTAB was mapped within valid PT_LOAD segments
            readelf_check=$(aarch64-linux-gnu-readelf -d app/src/main/jniLibs/arm64-v8a/libagy.so 2>&1)
            if echo "$readelf_check" | grep -qi "unable to parse DT_STRTAB"; then
              echo "FATAL: libagy.so DT_STRTAB corrupted by patchelf!" >&2
              echo "$readelf_check" >&2
              exit 1
            fi
            echo "Verified libagy.so ELF integrity successfully."
          fi

          # Synchronize latest agy-ui web assets into usr-data.tar.zst if present
          if [ -d "agy-ui" ] && [ -f "app/src/main/assets/usr-data.tar.zst" ]; then
            echo "Syncing latest agy-ui assets into usr-data.tar.zst..."
            TEMP_USR=$(mktemp -d)
            tar --zstd -xf app/src/main/assets/usr-data.tar.zst -C "$TEMP_USR"
            mkdir -p "$TEMP_USR/share/agy-ui"
            cp -rL agy-ui/* "$TEMP_USR/share/agy-ui/"
            chmod 755 "$TEMP_USR/share/agy-ui/ask_question.py" 2>/dev/null || true
            find "$TEMP_USR/share/agy-ui" -type f \( -name "*.py" -o -name "*.json" -o -name "*.html" -o -name "*.js" \) -exec \
              sed -i "s|/data/data/com.termux|/data/data/ai.agy.app|g" {} + 2>/dev/null || true
            tar --zstd -cf app/src/main/assets/usr-data.tar.zst -C "$TEMP_USR" .
            rm -rf "$TEMP_USR"
          fi

          OLD_SHA256=$(grep '^AGY_SHA256=' version.properties | cut -d'=' -f2)
          printf "# Antigravity Studio Version Specification\nVERSION_CODE=%s\nVERSION_NAME=%s\nAGY_VERSION=%s\nAGY_SHA256=%s\n" \
            "$NEW_CODE" "$NEW_NAME" "$NEW_AGY_VER" "${NEW_SHA256:-$OLD_SHA256}" > version.properties

          # Create release metadata manifest
          printf '{\n  "version_code": %s,\n  "version_name": "%s",\n  "agy_version": "%s",\n  "apk_name": "AntigravityStudio-v%s.apk"\n}\n' \
            "$NEW_CODE" "$NEW_NAME" "$NEW_AGY_VER" "$NEW_NAME" > release-metadata.json

          echo "new_name=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "new_code=$NEW_CODE" >> $GITHUB_OUTPUT

      - name: Make Gradlew Executable
        if: steps.check_upstream.outputs.should_build == 'true'
        run: chmod +x gradlew

      - name: Build Release APK
        if: steps.check_upstream.outputs.should_build == 'true'
        env:
          AGY_KEYSTORE_BASE64: ${{ secrets.AGY_KEYSTORE_BASE64 }}
          AGY_KEYSTORE_PASSWORD: ${{ secrets.AGY_KEYSTORE_PASSWORD }}
          AGY_KEY_ALIAS: ${{ secrets.AGY_KEY_ALIAS }}
          AGY_KEY_PASSWORD: ${{ secrets.AGY_KEY_PASSWORD }}
        run: |
          # Remove local Termux aapt2 override on Linux x86_64 CI runner
          if [ ! -f "/data/data/com.termux/files/usr/bin/aapt2" ]; then
            sed -i '/aapt2FromMavenOverride/d' gradle.properties
          fi
          # Fallback: create ~/.android/debug.keystore if neither secrets nor keystore exist
          mkdir -p ~/.android
          if [ -z "$AGY_KEYSTORE_BASE64" ] && [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          # Ensure arm64 binaries use 16KB page alignment on x86_64 runner (excluding libagy.so which is already aligned)
          find app/src/main/jniLibs -name "*.so" ! -name "libagy.so" -exec patchelf --page-size 16384 {} + 2>/dev/null || true
          ./gradlew assembleRelease --stacktrace

      - name: Verify & Stage Generated APKs
        if: steps.check_upstream.outputs.should_build == 'true'
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          [ ! -f "$APK_SRC" ] && APK_SRC="app/build/outputs/apk/release/app-release-unsigned.apk"
          
          # Assert presence of critical container subsystem binaries
          for req in libagy_sh.so libproot.so libproot_loader.so libagy_shim.so libbash.so libagy.so; do
            if ! unzip -l "$APK_SRC" | grep -q "$req"; then
              echo "FATAL: $req missing from built APK!" >&2
              exit 1
            fi
          done
          echo "Verified all critical native libraries inside generated APK."

          NEW_NAME="${{ steps.version_bump.outputs.new_name }}"
          cp "$APK_SRC" "AntigravityStudio-v${NEW_NAME}.apk"
          cp "$APK_SRC" "AntigravityStudio.apk"
          ls -lh AntigravityStudio*.apk release-metadata.json

      - name: Commit & Push Updated Version
        if: steps.check_upstream.outputs.should_build == 'true'
        run: |
          git checkout -- gradle.properties 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore(release): bump version to v${{ steps.version_bump.outputs.new_name }} [skip ci]"
          git push origin master

      - name: Create GitHub Release & Upload Assets
        if: steps.check_upstream.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version_bump.outputs.new_name }}"
          name: "Antigravity Studio v${{ steps.version_bump.outputs.new_name }}"
          body: |
            ### Antigravity Studio Android v${{ steps.version_bump.outputs.new_name }}
            
            - **Google Antigravity Runtime**: v${{ steps.check_upstream.outputs.upstream_ver }}
            - **Package Version Code**: ${{ steps.version_bump.outputs.new_code }}
            - **Target SDK**: 35 (Android 15 / 16 / 17+)
            - **Architecture**: arm64-v8a (16KB page size compliant)
            
            #### Automated Cloud Build
            Compiled and published automatically by GitHub Actions.
          files: |
            AntigravityStudio-v${{ steps.version_bump.outputs.new_name }}.apk
            AntigravityStudio.apk
            release-metadata.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
